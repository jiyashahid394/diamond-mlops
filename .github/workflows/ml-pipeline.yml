name: ML Pipeline

on:
  push:
    branches: [main]

jobs:
  train-test-release:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install libraries
        run: pip install -r requirements-dev.txt

      - name: Pull data from S3 with DVC
        run: dvc pull

      - name: Data tests
        run: pytest -q tests/test_data.py

      - name: Train the model
        run: python train.py forest

      - name: Quality gate
        run: pytest -q tests/test_model.py

      - name: Use the new model as champion.pkl
        run: cp model_latest.pkl champion.pkl

      - name: API tests
        run: pytest -q tests/test_api.py

      - name: Save metrics report
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: metrics.json

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/diamond-api:build-${{ github.run_number }}
