apiVersion: apps/v1
kind: Deployment
metadata:
  name: diamond-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: diamond-api
  template:
    metadata:
      labels:
        app: diamond-api
    spec:
      containers:
        - name: diamond-api
          image: YOUR_DOCKERHUB_USERNAME/diamond-api:build-1
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
